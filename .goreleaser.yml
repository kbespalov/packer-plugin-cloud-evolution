# Recommended HashiCorp plugin release layout.
# packer init needs a GitHub repo named packer-plugin-* and these assets.
builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/kbespalov/packer-plugin-cloud-evolution/version.Version={{.Version}} -X github.com/kbespalov/packer-plugin-cloud-evolution/version.VersionPrerelease=
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"

archives:
  - format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    cmd: cosign
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "${artifact}"]
    signature: ${artifact}.sig
    optional: true

release:
  draft: true

changelog:
  sort: asc
