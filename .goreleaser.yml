# Packer github-getter fetches these exact names (tag v0.1.0 → Version 0.1.0):
#   packer-plugin-cloud-evolution_v0.1.0_SHA256SUMS
#   packer-plugin-cloud-evolution_v0.1.0_x5.0_{os}_{arch}.zip
# The zip must contain a binary with the same stem.
# API_VERSION comes from `go run . describe` (x5.0).
version: 2

project_name: packer-plugin-cloud-evolution

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/kbespalov/packer-plugin-cloud-evolution/version.Version={{.Version}} -X github.com/kbespalov/packer-plugin-cloud-evolution/version.VersionPrerelease=
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}_{{ .Env.API_VERSION }}_{{ .Os }}_{{ .Arch }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Env.API_VERSION }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: "{{ .ProjectName }}_v{{ .Version }}_SHA256SUMS"
  algorithm: sha256

release:
  draft: false

changelog:
  sort: asc
